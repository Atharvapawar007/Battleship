<!doctype html>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <body>
        <header class="site-header">
            <h1>Battleship</h1>
        </header>

        <dialog id="start-modal">
            <form action="#">
                <h2>Player Setup</h2>
                <p>Enter a name for each player to begin.</p>

                <div class="form-row">
                    <label for="player-name">Player 1 name</label>
                    <input type="text" id="player1-name" name="player1-name" required />
                </div>

                <div class="form-row">
                    <label for="player2-name">Player 2 name</label>
                    <input type="text" id="player2-name" name="player2-name" required />
                </div>

                <div class="dialog-actions">
                    <button type="submit">Start Game</button>
                </div>
            </form>
        </dialog>

        <dialog id="battleship-details-modal">
            <form action="#">
                <h2>Place a Ship</h2>
                <p>Enter Battleship details for <span id="entry-player-name"></span></p>

                <div class="form-row">
                    <label for="ship-name">Ship name</label>
                    <input type="text" id="ship-name" name="ship-name" required />
                </div>

                <div class="form-row">
                    <label for="ship-length">Ship length</label>
                    <input
                        type="number"
                        id="ship-length"
                        name="ship-length"
                        min="1"
                        max="10"
                        required
                    />
                </div>

                <fieldset class="form-row coordinate-fieldset">
                    <legend>Starting cell</legend>
                    <div class="coordinate-inputs">
                        <div>
                            <label for="ship-start-x">Row</label>
                            <input
                                type="number"
                                id="ship-start-x"
                                name="ship-start-x"
                                min="0"
                                max="9"
                                required
                            />
                        </div>
                        <div>
                            <label for="ship-start-y">Column</label>
                            <input
                                type="number"
                                id="ship-start-y"
                                name="ship-start-y"
                                min="0"
                                max="9"
                                required
                            />
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-row">
                    <legend>Orientation</legend>
                    <div class="orientation-choice">
                        <input
                            type="radio"
                            id="choice-horizontal"
                            name="orientation"
                            value="horizontal"
                            checked
                        />
                        <label for="choice-horizontal">Horizontal</label>

                        <input
                            type="radio"
                            id="choice-vertical"
                            name="orientation"
                            value="vertical"
                        />
                        <label for="choice-vertical">Vertical</label>
                    </div>
                </fieldset>

                <div class="dialog-actions">
                    <button type="submit">Place Ship</button>
                </div>
            </form>
        </dialog>

        <dialog id="error-modal">
            <h2>Error</h2>
            <p></p>
        </dialog>

        <dialog id="winner-modal">
            <h2>Error</h2>
            <p></p>
        </dialog>
